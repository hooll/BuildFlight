# ============================================================
# BuildFlight - 套餐兑换
# 每个套餐 = 一组材料 + 固定能量奖励。
# 套餐按钮排在材料按钮之前；左键兑换 1 份，Shift+左键兑换尽可能多份，右键兑换 1 份。
# 套餐的“折扣”由 points 与单件兑换总价的差额体现，GUI 会自动显示对比。
# 默认不启用任何套餐；取消下面示例的注释即可。
# ============================================================

bundles:
  # 示例一：折扣钻石套餐
  # 64 钻石按单件价合计 64 点；套餐给 80 点，等于多给 25%。
  # diamond_64:
  #   name: "&b钻石套餐 &7(64 件)"
  #   icon: DIAMOND
  #   points: 80
  #   items:
  #     DIAMOND: 64
  #
  # 示例二：钻石 + 下界合金锭套餐
  # 32 钻石 + 4 下界合金锭按单件价合计 72 点；套餐给 90 点，等于多给 25%。
  # diamond_netherite:
  #   name: "&6钻石+下界合金套餐"
  #   icon: NETHERITE_INGOT
  #   points: 90
  #   items:
  #     DIAMOND: 32
  #     NETHERITE_INGOT: 4
